  <script src="/_sdk/5629ea66dc55d54f.editing_sdk.js" integrity="sha512-snPYzGvgiTEMUBOb+HlCBkFeiM0IRX4hcgA78wvalhC0WnJtaX+RCbosPWtNqZsZ7sZ9NwN0oePZYa+IlMwa+w=="></script>
  <script>
    const panels = Array.from(document.querySelectorAll('.question-panel'));
    const progress = document.getElementById('progress-count');
    const progressFill = document.getElementById('progress-fill');
    const nextArea = document.getElementById('next-area');
    const nextButton = document.getElementById('next-button');
    const resultsPanel = document.getElementById('results-panel');
    let current = 0;
    let score = 0;

    function updateProgress() {
      progress.textContent = (current + 1) + ' / 10';
      progressFill.style.width = ((current + 1) * 10) + '%';
    }

    document.querySelectorAll('.answer').forEach(button => {
      button.addEventListener('click', () => {
        const panel = button.closest('.question-panel');
        if (panel.dataset.answered === 'true') return;
        panel.dataset.answered = 'true';
        const isCorrect = button.dataset.correct === 'true';
        panel.querySelectorAll('.answer').forEach(answer => {
          answer.disabled = true;
          if (answer.dataset.correct === 'true') answer.classList.add('correct');
        });
        if (isCorrect) {
          score++;
          panel.querySelector('[data-template-id$="-correct"]').classList.add('show');
        } else {
          button.classList.add('wrong');
          panel.querySelector('[data-template-id$="-wrong"]').classList.add('show');
        }
        nextArea.classList.remove('hidden');
        nextArea.classList.add('flex');
      });
    });

    nextButton.addEventListener('click', () => {
      panels[current].classList.remove('active');
      current++;
      if (current < panels.length) {
        panels[current].classList.add('active');
        nextArea.classList.add('hidden');
        nextArea.classList.remove('flex');
        updateProgress();
      } else {
        nextArea.classList.add('hidden');
        nextArea.classList.remove('flex');
        document.querySelector('.mb-8').classList.add('hidden');
        resultsPanel.classList.remove('hidden');
        document.getElementById('final-score').textContent = score + ' / 10';
      }
    });

    document.getElementById('restart-button').addEventListener('click', () => {
      current = 0;
      score = 0;
      panels.forEach((panel, index) => {
        panel.dataset.answered = 'false';
        panel.classList.toggle('active', index === 0);
        panel.querySelectorAll('.answer').forEach(answer => {
          answer.disabled = false;
          answer.classList.remove('correct', 'wrong');
        });
        panel.querySelectorAll('.feedback').forEach(feedback => feedback.classList.remove('show'));
      });
      resultsPanel.classList.add('hidden');
      document.querySelector('.mb-8').classList.remove('hidden');
      updateProgress();
    });

    const fallbackText = {
      'quiz-kicker':'National 5 Computing Science','quiz-title':'Floating Point Numbers Quiz',
      'progress-label':'Your progress','next-button':'Next question','restart-button':'Try again',
      'footer-note':'Based on the Floating Point Numbers lesson.','results-title':'Quiz complete!','results-message':'Great effort. Review the feedback above and try again whenever you want to strengthen your understanding.',
      'q1-question':'Which type of number is floating point representation used to store?',
      'q1-a':'Only whole numbers','q1-b':'Real numbers with decimal portions','q1-c':'Only binary digits',
      'q2-question':'What are the two stored parts of a floating point number?',
      'q2-a':'Base and byte','q2-b':'Mantissa and exponent','q2-c':'Integer and decimal point',
      'q3-question':'What does the mantissa represent?',
      'q3-a':'All the significant digits in the number','q3-b':'The number of bytes used','q3-c':'The base of the number system',
      'q4-question':'What does the exponent show in scientific notation?',
      'q4-a':'How many bits are in a byte','q4-b':'How far the decimal point moves','q4-c':'How many significant digits exist',
      'q5-question':'In the lesson example, what is the mantissa for 4.2 × 10⁸ after the decimal point is omitted?',
      'q5-a':'4','q5-b':'8','q5-c':'42',
      'q6-question':'Which scientific notation represents 27.5?',
      'q6-a':'2.75 × 10¹','q6-b':'27.5 × 10¹','q6-c':'2.75 × 10²',
      'q7-question':'Why is the base not stored with a floating point number?',
      'q7-a':'It is too large to store','q7-b':'It is implied or already known','q7-c':'It is replaced by the mantissa',
      'q8-question':'How many bits are used by single-precision floating point format?',
      'q8-a':'8 bits','q8-b':'16 bits','q8-c':'32 bits',
      'q9-question':'How many bytes are used by a 32-bit single-precision number?',
      'q9-a':'4 bytes','q9-b':'8 bytes','q9-c':'32 bytes',
      'q10-question':'How many bytes are used by a 64-bit double-precision number?',
      'q10-a':'4 bytes','q10-b':'8 bytes','q10-c':'64 bytes'
    };
    Object.entries(fallbackText).forEach(([id, text]) => {
      const element = document.querySelector('[data-template-id="' + id + '"]');
      if (element && !element.textContent.trim()) element.textContent = text;
    });
    document.querySelectorAll('[data-template-id$="-correct"]').forEach(element => {
      if (!element.textContent.trim()) element.textContent = 'Correct! Great work.';
    });
    document.querySelectorAll('[data-template-id$="-wrong"]').forEach(element => {
      if (!element.textContent.trim()) element.textContent = 'Not quite. Review the correct answer highlighted above.';
    });
    if (window.lucide) lucide.createIcons();
  </script>
