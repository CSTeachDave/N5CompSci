  <script src="/_sdk/5629ea66dc55d54f.editing_sdk.js" integrity="sha512-snPYzGvgiTEMUBOb+HlCBkFeiM0IRX4hcgA78wvalhC0WnJtaX+RCbosPWtNqZsZ7sZ9NwN0oePZYa+IlMwa+w=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const questions = Array.from(document.querySelectorAll(".question-view"));
      const resultsView = document.getElementById("results-view");
      const progressLabel = document.getElementById("progress-label");
      const progressFill = document.getElementById("progress-fill");
      const liveScore = document.getElementById("live-score");
      const finalScore = document.getElementById("final-score");
      const resultMessage = document.getElementById("result-message");
      let currentQuestion = 0;
      let score = 0;

      function updateScore() {
        liveScore.textContent = score + " / 10";
      }

      function showQuestion(index) {
        questions.forEach((question, questionIndex) => {
          question.classList.toggle("active", questionIndex === index);
        });
        progressLabel.textContent = "Question " + (index + 1) + " of 10";
        progressFill.style.width = ((index + 1) * 10) + "%";
      }

      function showResults() {
        questions.forEach(question => question.classList.remove("active"));
        resultsView.classList.remove("hidden");
        progressLabel.textContent = "Quiz complete";
        progressFill.style.width = "100%";
        finalScore.textContent = score + " / 10";

        if (score === 10) {
          resultMessage.textContent = "Outstanding — you have mastered these binary integer foundations.";
        } else if (score >= 7) {
          resultMessage.textContent = "Strong work! Review any explanations you missed and you will be ready.";
        } else if (score >= 4) {
          resultMessage.textContent = "Good effort. Revisit binary place values and conversions, then try again.";
        } else {
          resultMessage.textContent = "Keep practising. Use the feedback to review the key binary concepts.";
        }
      }

      document.querySelectorAll(".answer-choice").forEach(button => {
        button.addEventListener("click", () => {
          const question = button.closest(".question-view");
          if (question.dataset.answered === "true") return;

          question.dataset.answered = "true";
          const correct = button.dataset.correct === "true";
          const answers = question.querySelectorAll(".answer-choice");
          answers.forEach(answer => {
            answer.disabled = true;
            if (answer.dataset.correct === "true") answer.classList.add("is-correct");
          });

          if (correct) {
            score += 1;
            button.classList.add("is-correct");
            question.querySelector('[data-template-id$="-correct"]').classList.add("show");
          } else {
            button.classList.add("is-wrong");
            question.querySelector('[data-template-id$="-wrong"]').classList.add("show");
          }

          updateScore();
          question.querySelector(".next-button").classList.remove("hidden");
        });
      });

      document.querySelectorAll(".next-button").forEach(button => {
        button.addEventListener("click", () => {
          if (currentQuestion === questions.length - 1) {
            showResults();
            return;
          }
          currentQuestion += 1;
          showQuestion(currentQuestion);
        });
      });

      document.querySelector('[data-template-id="restart-button"]').addEventListener("click", () => {
        score = 0;
        currentQuestion = 0;
        updateScore();
        resultsView.classList.add("hidden");

        questions.forEach(question => {
          delete question.dataset.answered;
          question.querySelectorAll(".answer-choice").forEach(answer => {
            answer.disabled = false;
            answer.classList.remove("is-correct", "is-wrong");
          });
          question.querySelectorAll(".feedback").forEach(feedback => feedback.classList.remove("show"));
          question.querySelector(".next-button").classList.add("hidden");
        });

        showQuestion(currentQuestion);
      });
    });
  </script>
 </body>
</html>
