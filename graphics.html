  <script src="/_sdk/6f16dc4ffc0cf3fe.editing_sdk.js" integrity="sha512-XcGkt+MVg9QK/rlrq9umdkP9LzshVjIu+vaITjWOSFti+dqk5aHBHkCCQ/IXnnUyJtw0F+lYzvT7m4EfPrBrjg=="></script>
  <script>
    const questions = [
      { category: "Foundations", q: "What does the word pixel stand for?", options: ["Picture element", "Pixelated image layer", "Picture extension", "Primary image location"], correct: 0, explanation: "A pixel is a picture element: one tiny dot that contributes to a bitmap image." },
      { category: "Bitmap graphics", q: "How does a bitmap image store its picture?", options: ["As a set of individual pixels", "As instructions for shapes", "As a list of file names", "As one continuous colour value"], correct: 0, explanation: "Bitmap graphics store a value for every individual pixel in the image." },
      { category: "Black and white", q: "In the black-and-white bitmap system used in the presentation, what does 0 represent?", options: ["A white pixel", "A black pixel", "A transparent pixel", "A grey pixel"], correct: 0, explanation: "For this black-and-white representation, 0 is white and 1 is black." },
      { category: "Black and white", q: "How much storage does one black-and-white pixel require?", options: ["1 bit", "1 byte", "8 bits", "24 bits"], correct: 0, explanation: "There are only two possible values, black or white, so each pixel needs one bit." },
      { category: "Resolution", q: "What is resolution in an image?", options: ["The number of pixels that make up the image", "The number of colours in the image", "The file type of the image", "The amount of compression used"], correct: 0, explanation: "Resolution describes the total number of pixels in an image, often calculated from width × height." },
      { category: "Resolution", q: "What is generally true of an image with higher resolution?", options: ["It is clearer and more detailed", "It has fewer pixels", "It uses no storage space", "It becomes a vector image"], correct: 0, explanation: "More pixels allow more detail to be represented, making an image clearer." },
      { category: "Colour depth", q: "What does colour depth describe?", options: ["How many bits are used to represent a pixel’s colour", "The physical depth of a screen", "The width of a bitmap", "The number of vector shapes"], correct: 0, explanation: "Colour depth is the number of bits used per pixel to encode colour information." },
      { category: "Colour depth", q: "How many colours can 8-bit colour depth represent?", options: ["256", "8", "24", "16,777,216"], correct: 0, explanation: "Eight bits give 2⁸ possible values, which equals 256 colours." },
      { category: "Colour depth", q: "True Colour is normally defined as which colour depth?", options: ["24-bit", "1-bit", "8-bit", "12-bit"], correct: 0, explanation: "True Colour uses 24 bits per pixel, typically 8 bits each for red, green and blue." },
      { category: "Colour depth", q: "How many colours can 24-bit True Colour represent?", options: ["16,777,216", "256", "1,024", "24"], correct: 0, explanation: "24-bit colour provides 2²⁴ possible colour values: 16,777,216." },
      { category: "Colour depth", q: "Which three additive primary colours are used to represent a True Colour pixel?", options: ["Red, green and blue", "Red, yellow and blue", "Cyan, magenta and yellow", "Black, white and grey"], correct: 0, explanation: "RGB is the additive colour model: red, green and blue values combine to produce colours." },
      { category: "Bitmap effects", q: "What usually happens to a bitmap image when it is enlarged too much?", options: ["It becomes pixelated", "It gains extra detail", "It changes into a vector", "It needs fewer pixels"], correct: 0, explanation: "Enlarging bitmap pixels makes the individual squares visible, causing pixelation." },
      { category: "Bitmap graphics", q: "Which is an advantage of bitmap graphics?", options: ["They can be edited at pixel level", "They never lose quality when scaled", "They require no storage", "They are resolution independent"], correct: 0, explanation: "Bitmap images can be manipulated pixel by pixel, which is useful for detailed editing." },
      { category: "Bitmap graphics", q: "Which type of image is bitmap graphics especially suitable for?", options: ["Photo-realistic images", "Simple logos that must scale infinitely", "Instructions for geometric shapes only", "Text-only documents"], correct: 0, explanation: "Bitmaps can represent the rich detail and subtle colour variation found in photographs." },
      { category: "Vector graphics", q: "What does a vector graphic store?", options: ["The attributes and instructions for shapes", "A value for every pixel", "Only the file size", "A photograph at high resolution"], correct: 0, explanation: "Vectors store shape instructions and attributes such as coordinates, fill colour and line colour." },
      { category: "Vector graphics", q: "Which file type is a common vector graphics format?", options: ["SVG", "JPEG", "BMP", "PNG"], correct: 0, explanation: "SVG stands for Scalable Vector Graphics and is a common vector file format." },
      { category: "Vector graphics", q: "What happens when a vector image is scaled up?", options: ["It keeps its quality", "It becomes pixelated", "Its colour depth drops", "It stores more pixels"], correct: 0, explanation: "Vector graphics are resolution independent, so they can be scaled without losing quality." },
      { category: "Vector shapes", q: "Which attribute is needed to describe a circle in a vector graphic?", options: ["Centre coordinates and radius", "Every pixel’s binary value", "Only its width in pixels", "Its colour depth only"], correct: 0, explanation: "A circle can be recreated using its centre coordinates, radius, fill colour and line attributes." },
      { category: "Vector shapes", q: "What information is especially important when describing a polygon?", options: ["Coordinates of each point", "The colour of every pixel", "Its screen resolution", "Its bitmap compression level"], correct: 0, explanation: "A polygon is defined by the coordinates of its vertices, alongside attributes such as fill and line colour." },
      { category: "Storage calculation", q: "A 100 × 50 pixel bitmap uses 8-bit colour. What is its size in bits?", options: ["40,000 bits", "5,000 bits", "400 bits", "50,000 bits"], correct: 0, explanation: "Resolution = 100 × 50 = 5,000 pixels. Size = resolution × bit depth = 5,000 × 8 = 40,000 bits." }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answers = [];

    const quizView = document.getElementById("quiz-view");
    const resultsView = document.getElementById("results-view");
    const questionCounter = document.getElementById("question-counter");
    const progressBar = document.getElementById("progress-bar");
    const liveScore = document.getElementById("live-score");
    const category = document.getElementById("question-category");
    const questionText = document.getElementById("question-text");
    const answerList = document.getElementById("answer-list");
    const feedbackPanel = document.getElementById("feedback-panel");
    const feedbackTitle = document.getElementById("feedback-title");
    const feedbackText = document.getElementById("feedback-text");
    const nextButton = document.getElementById("next-button");

    function renderQuestion() {
      const question = questions[currentQuestion];
      questionCounter.textContent = `${currentQuestion + 1} / ${questions.length}`;
      progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      liveScore.textContent = score;
      category.textContent = question.category;
      questionText.textContent = question.q;
      answerList.innerHTML = "";
      feedbackPanel.classList.add("hidden");
      nextButton.classList.add("hidden");

      question.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-btn fade-in w-full rounded-2xl bg-white px-4 py-4 text-left font-semibold text-slate-700 sm:px-5";
        button.style.animationDelay = `${index * 55}ms`;
        button.setAttribute("aria-label", `Answer ${String.fromCharCode(65 + index)}: ${option}`);
        button.innerHTML = `<span class="flex items-center gap-3"><span class="option-letter grid place-items-center rounded-lg bg-[#edf0f9] text-sm text-[#283c8e]">${String.fromCharCode(65 + index)}</span><span>${option}</span></span>`;
        button.addEventListener("click", () => selectAnswer(index));
        answerList.appendChild(button);
      });
    }

    function selectAnswer(selectedIndex) {
      const question = questions[currentQuestion];
      const isCorrect = selectedIndex === question.correct;
      answers[currentQuestion] = selectedIndex;
      if (isCorrect) score += 1;

      [...answerList.children].forEach((button, index) => {
        button.disabled = true;
        if (index === question.correct) button.classList.add("correct");
        if (index === selectedIndex && !isCorrect) button.classList.add("incorrect");
      });

      feedbackPanel.classList.remove("hidden");
      feedbackPanel.className = `mt-6 rounded-2xl border p-5 fade-in ${isCorrect ? "border-[#9bd2af] bg-[#edf9f1] text-[#145534]" : "border-[#efb5c0] bg-[#fff1f3] text-[#7f2637]"}`;
      feedbackTitle.textContent = isCorrect ? "Correct — well done." : "Not quite.";
      feedbackText.textContent = question.explanation;
      liveScore.textContent = score;
      nextButton.classList.remove("hidden");
    }

    function showResults() {
      quizView.classList.add("hidden");
      resultsView.classList.remove("hidden");
      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById("final-score").textContent = `${score} / ${questions.length}`;
      document.getElementById("score-message").textContent =
        percentage >= 85 ? "Excellent work — you have a strong understanding of storing graphics." :
        percentage >= 60 ? "Good progress — review the questions below to strengthen your knowledge." :
        "Keep revising the key ideas, then try again to improve your score.";

      const reviewList = document.getElementById("review-list");
      reviewList.innerHTML = "";
      questions.forEach((question, index) => {
        const correct = answers[index] === question.correct;
        const item = document.createElement("article");
        item.className = `rounded-2xl border p-4 ${correct ? "border-[#b8dfc4] bg-[#f2fbf5]" : "border-[#f0c1ca] bg-[#fff6f7]"}`;
        item.innerHTML = `
          <div class="flex items-start gap-3">
            <span class="mono mt-0.5 grid h-7 w-7 place-items-center rounded-md ${correct ? "bg-[#19794f] text-white" : "bg-[#b3263d] text-white"}">${correct ? "✓" : "×"}</span>
            <div>
              <p class="font-bold text-[#202a55]">Q${index + 1}. ${question.q}</p>
              <p class="mt-1 text-sm text-slate-600"><strong>Correct answer:</strong> ${question.options[question.correct]}</p>
            </div>
          </div>`;
        reviewList.appendChild(item);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    nextButton.addEventListener("click", () => {
      if (currentQuestion === questions.length - 1) {
        showResults();
      } else {
        currentQuestion += 1;
        renderQuestion();
      }
    });

    document.getElementById("restart-button").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      answers = [];
      resultsView.classList.add("hidden");
      quizView.classList.remove("hidden");
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderQuestion();
  </script>
