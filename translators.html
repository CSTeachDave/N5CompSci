  <script src="/_sdk/5629ea66dc55d54f.editing_sdk.js" integrity="sha512-snPYzGvgiTEMUBOb+HlCBkFeiM0IRX4hcgA78wvalhC0WnJtaX+RCbosPWtNqZsZ7sZ9NwN0oePZYa+IlMwa+w=="></script>
  <script>
    // Standalone fallback: Canva normally supplies this copy through config.json.
    // Keeping the quiz copy here also lets a saved HTML file run by itself.
    const standaloneCopy = {
      "header-kicker":"National 5 Computing Science","quiz-title":"Translator Programs Quiz","score-label":"Live score","progress-caption":"Choose the best answer","correct-heading":"Correct!","wrong-heading":"Not quite","next-button":"Continue","finish-button":"See my results","results-heading":"Quiz complete!","results-message":"Well done for reviewing the key ideas about translators, machine code, and the fetch-decode-execute cycle.","restart-button":"Try again",
      "q1-tag":"Languages","q1-question":"Which two symbols make up machine code?","q1-a0":"A and B","q1-a1":"0 and 1","q1-a2":"True and False","q1-a3":"On and Off only","q1-correct":"Machine code uses binary: 0 and 1.","q1-wrong":"The correct answer is 0 and 1. Machine code is made from these two binary symbols.",
      "q2-tag":"Languages","q2-question":"Why must high-level language source code be translated?","q2-a0":"To make it longer","q2-a1":"To make it English","q2-a2":"Computers only understand machine code","q2-a3":"To store it permanently in RAM","q2-correct":"Exactly. A computer needs instructions translated into machine code.","q2-wrong":"The correct answer is that computers only understand machine code, so high-level source code must be translated.",
      "q3-tag":"Translator programs","q3-question":"What does an interpreter do?","q3-a0":"Translates and executes one line at a time","q3-a1":"Translates an entire program once and saves it","q3-a2":"Only checks spelling in source code","q3-a3":"Fetches instructions directly from storage","q3-correct":"An interpreter works line by line, translating and executing each line.","q3-wrong":"The correct answer is that an interpreter translates and executes one line at a time.",
      "q4-tag":"Interpreter","q4-question":"Which is an advantage of using an interpreter?","q4-a0":"Source code is hidden from users","q4-a1":"Errors can be identified line by line","q4-a2":"It never needs to be loaded into RAM","q4-a3":"It produces an executable file every time","q4-correct":"Correct. Line-by-line feedback can make interpreted programs easier to debug.","q4-wrong":"The correct answer is that errors can be identified line by line, which helps with debugging.",
      "q5-tag":"Interpreter","q5-question":"What must happen every time an interpreted program is executed?","q5-a0":"The source code is deleted","q5-a1":"A compiler is downloaded","q5-a2":"The program is re-interpreted","q5-a3":"Object code is installed","q5-correct":"Yes. Interpreted programs must be translated again for every execution.","q5-wrong":"The correct answer is that the program is re-interpreted every time it runs.",
      "q6-tag":"Compiler","q6-question":"How does a compiler translate source code?","q6-a0":"One character at a time","q6-a1":"The entire program at once","q6-a2":"Only when an error is found","q6-a3":"Only one line each week","q6-correct":"A compiler translates the entire source code into machine code in one go.","q6-wrong":"The correct answer is the entire program at once. This creates code that can be run again later.",
      "q7-tag":"Compiler","q7-question":"What is produced by a compiler that can be saved and run later?","q7-a0":"Source code","q7-a1":"A spoken translation","q7-a2":"RAM","q7-a3":"Object code","q7-correct":"Correct. A compiler creates object code, which can be saved and executed later.","q7-wrong":"The correct answer is object code. It is the translated machine code output from compilation.",
      "q8-tag":"Compiled applications","q8-question":"Which statement is true about a compiled application downloaded from an app store?","q8-a0":"You cannot see its source code","q8-a1":"It must be re-interpreted every time","q8-a2":"It only runs while the compiler is open","q8-a3":"It contains only English words","q8-correct":"Right. Compiled applications do not reveal their original source code.","q8-wrong":"The correct answer is that you cannot see the source code in a compiled application.",
      "q9-tag":"Fetch-decode-execute","q9-question":"What is the correct order of the fetch-decode-execute cycle?","q9-a0":"Decode, execute, fetch","q9-a1":"Execute, fetch, decode","q9-a2":"Fetch, decode, execute","q9-a3":"Fetch, execute, delete","q9-correct":"Correct. The processor fetches an instruction, decodes it, then executes it.","q9-wrong":"The correct order is fetch, decode, execute.",
      "q10-tag":"Memory and processing","q10-question":"Where are programs and data fetched from before being decoded and executed?","q10-a0":"The internet","q10-a1":"Main memory (RAM)","q10-a2":"The keyboard","q10-a3":"The compiler only","q10-correct":"Exactly. Programs and data are fetched from main memory, also called RAM.","q10-wrong":"The correct answer is main memory (RAM). Instructions and data are fetched from RAM for processing."
    };
    Object.entries(standaloneCopy).forEach(([id, text]) => {
      const element = document.querySelector(`[data-template-id="${id}"]`);
      if (element && !element.textContent.trim()) element.textContent = text;
    });
    document.querySelectorAll('[data-next][data-template-id]').forEach((button) => {
      if (!button.textContent.trim()) button.textContent = button.id === 'finish-button' ? standaloneCopy['finish-button'] : standaloneCopy['next-button'];
    });

    const correctAnswers = [1, 2, 0, 1, 2, 1, 3, 0, 2, 1];
    let currentQuestion = 0;
    let score = 0;

    const panels = [...document.querySelectorAll(".question-panel")];
    const scoreDisplay = document.getElementById("score-display");
    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const quizArea = document.getElementById("quiz-area");
    const resultsPanel = document.getElementById("results-panel");

    function updateStatus() {
      scoreDisplay.textContent = score + " / 10";
      progressText.textContent = "Question " + (currentQuestion + 1) + " of 10";
      progressBar.style.width = ((currentQuestion + 1) * 10) + "%";
    }

    function selectAnswer(button) {
      const panel = button.closest(".question-panel");
      const questionIndex = Number(panel.dataset.question);
      const selectedChoice = Number(button.dataset.choice);
      const isCorrect = selectedChoice === correctAnswers[questionIndex];

      panel.querySelectorAll("[data-choice]").forEach((choiceButton) => {
        choiceButton.disabled = true;
        if (Number(choiceButton.dataset.choice) === correctAnswers[questionIndex]) {
          choiceButton.classList.add("is-correct");
        }
      });

      if (isCorrect) {
        score += 1;
        button.classList.add("is-correct");
        panel.querySelector('[data-feedback="correct"]').classList.remove("hidden");
      } else {
        button.classList.add("is-wrong");
        panel.querySelector('[data-feedback="wrong"]').classList.remove("hidden");
      }

      scoreDisplay.textContent = score + " / 10";
      panel.querySelector("[data-next]").classList.remove("hidden");
    }

    function showQuestion(index) {
      panels.forEach((panel, panelIndex) => panel.classList.toggle("active", panelIndex === index));
      currentQuestion = index;
      updateStatus();
      panels[index].querySelector("[data-choice]").focus();
    }

    document.querySelectorAll("[data-choice]").forEach((button) => {
      button.addEventListener("click", () => selectAnswer(button));
    });

    document.querySelectorAll("[data-next]").forEach((button) => {
      button.addEventListener("click", () => {
        if (currentQuestion === 9) {
          quizArea.classList.add("hidden");
          resultsPanel.classList.remove("hidden");
          progressText.textContent = "Quiz complete";
          progressBar.style.width = "100%";
          document.getElementById("final-score").textContent = score + " / 10";
          document.getElementById("restart-button").focus();
        } else {
          showQuestion(currentQuestion + 1);
        }
      });
    });

    document.getElementById("restart-button").addEventListener("click", () => {
      score = 0;
      currentQuestion = 0;
      resultsPanel.classList.add("hidden");
      quizArea.classList.remove("hidden");
      panels.forEach((panel, index) => {
        panel.querySelectorAll("[data-choice]").forEach((button) => {
          button.disabled = false;
          button.classList.remove("is-correct", "is-wrong");
        });
        panel.querySelectorAll("[data-feedback], [data-next]").forEach((element) => element.classList.add("hidden"));
        panel.classList.toggle("active", index === 0);
      });
      updateStatus();
      panels[0].querySelector("[data-choice]").focus();
    });

    lucide.createIcons();
  </script>
