  <script src="/_sdk/6f16dc4ffc0cf3fe.editing_sdk.js" integrity="sha512-XcGkt+MVg9QK/rlrq9umdkP9LzshVjIu+vaITjWOSFti+dqk5aHBHkCCQ/IXnnUyJtw0F+lYzvT7m4EfPrBrjg=="></script>
  <script>
    const questions = [
      { category: "Text storage", q: "How can text be stored by a computer that only understands binary?", options: ["By storing characters as binary numbers", "By storing each word as an image", "By storing text as sound waves", "By storing letters as colours"], correct: 0, explanation: "Each character is assigned a numerical code, which the computer stores in binary." },
      { category: "ASCII", q: "What does ASCII stand for?", options: ["American Standard Code for Information Interchange", "Advanced System Code for Internet Information", "American Symbol Character Interchange Index", "Automatic Standard Character Input Instruction"], correct: 0, explanation: "ASCII means American Standard Code for Information Interchange." },
      { category: "ASCII", q: "What is the ASCII code for the capital letter A?", options: ["0100 0001 (65)", "0100 0010 (66)", "0011 0001 (49)", "0110 0001 (97)"], correct: 0, explanation: "Capital A has the decimal ASCII value 65, represented as 0100 0001 in eight bits." },
      { category: "ASCII", q: "How many characters can the original 7-bit ASCII code represent?", options: ["128", "64", "256", "512"], correct: 0, explanation: "Seven bits provide 2⁷, or 128, possible values." },
      { category: "Extended ASCII", q: "How many bits are used for one extended ASCII value?", options: ["8 bits", "7 bits", "16 bits", "32 bits"], correct: 0, explanation: "Extended ASCII uses 8-bit units, equal to one byte per character." },
      { category: "ASCII table", q: "How many values are in the ASCII table?", options: ["128", "52", "10", "256"], correct: 0, explanation: "The original ASCII table contains 128 values, including printable and control characters." },
      { category: "ASCII table", q: "What is the ASCII decimal code for the symbol @?", options: ["64", "65", "97", "48"], correct: 0, explanation: "The ASCII table assigns the @ symbol the decimal code 64." },
      { category: "ASCII table", q: "Which characters have ASCII codes in the range shown for 48 to 50?", options: ["The digits 0, 1 and 2", "The letters A, B and C", "The letters a, b and c", "The symbols @, # and $"], correct: 0, explanation: "ASCII codes 48, 49 and 50 represent the digits 0, 1 and 2." },
      { category: "Control characters", q: "What is a control character?", options: ["A non-printable character that has an effect on the screen", "A character used only in a password", "A printable symbol with a colour code", "A character that always represents a number"], correct: 0, explanation: "Control characters are non-printable and can perform actions such as Enter, Tab or Backspace." },
      { category: "Control characters", q: "Which is an example of a control character?", options: ["The Enter key", "The letter A", "The number 5", "The @ symbol"], correct: 0, explanation: "The Enter key produces a non-printable control character that affects the display or cursor." },
      { category: "Character sets", q: "What is a character set?", options: ["The complete set of characters a computer can represent", "A list of only the letters in a word", "The physical keys on one keyboard", "A set of colours used on screen"], correct: 0, explanation: "A character set is the complete collection of characters that a computer system can represent." },
      { category: "Character sets", q: "Why are different character sets needed?", options: ["Different languages need different characters", "Computers cannot store numbers", "Every keyboard has a different screen", "They make binary unnecessary"], correct: 0, explanation: "Different languages use different symbols, so a suitable character set is needed to represent them." },
      { category: "Character sets", q: "What can a character set change?", options: ["The layout of a keyboard", "The size of a computer monitor", "The speed of a processor", "The number of files in a folder"], correct: 0, explanation: "Character sets can affect keyboard layouts; for example, the positions of @ and quotation marks can differ." },
      { category: "ASCII summary", q: "How much memory does one extended ASCII character require?", options: ["8 bits (1 byte)", "1 bit", "16 bits (2 bytes)", "32 bits (4 bytes)"], correct: 0, explanation: "An extended ASCII value uses 8 bits, which is one byte of memory." },
      { category: "Unicode", q: "Why is Unicode needed as an alternative to ASCII?", options: ["ASCII cannot represent many world languages", "ASCII cannot represent English letters", "Unicode uses no binary values", "ASCII only stores images"], correct: 0, explanation: "ASCII has a limited set of characters, so it cannot represent many languages such as Chinese." },
      { category: "Unicode", q: "How many bits did Unicode originally use?", options: ["16 bits", "8 bits", "7 bits", "64 bits"], correct: 0, explanation: "Unicode was originally designed as a 16-bit character code." },
      { category: "Unicode", q: "How many bits can a Unicode character require today?", options: ["8, 16 or 32 bits", "Only 7 bits", "Only 8 bits", "16 or 64 bits only"], correct: 0, explanation: "The presentation explains that Unicode characters can require 8, 16 or 32 bits." },
      { category: "Unicode", q: "What is one disadvantage of Unicode compared with ASCII?", options: ["It can use more memory per character", "It cannot represent more languages", "It has no character codes", "It only represents control characters"], correct: 0, explanation: "Unicode represents many more characters, but some characters require more storage space." },
      { category: "Unicode", q: "What do the first 128 Unicode values represent?", options: ["The existing ASCII table", "Only Chinese characters", "Control characters only", "The extended ASCII table only"], correct: 0, explanation: "The first 128 Unicode values are the same as the existing ASCII values." },
      { category: "Text storage", q: "Which statement best compares ASCII and Unicode?", options: ["Unicode represents more characters and languages but may use more storage", "ASCII represents every language using fewer bits", "Unicode is only used for numbers", "ASCII and Unicode always use exactly the same storage"], correct: 0, explanation: "Unicode supports a much wider range of characters and languages, although this can require more storage." }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answers = [];
    let displayedOptions = [];
    let displayedCorrectIndex = 0;

    const quizView = document.getElementById("quiz-view");
    const resultsView = document.getElementById("results-view");
    const questionCounter = document.getElementById("question-counter");
    const progressBar = document.getElementById("progress-bar");
    const liveScore = document.getElementById("live-score");
    const category = document.getElementById("question-category");
    const questionText = document.getElementById("question-text");
    const answerList = document.getElementById("answer-list");
    const feedbackPanel = document.getElementById("feedback-panel");
    const feedbackTitle = document.getElementById("feedback-title");
    const feedbackText = document.getElementById("feedback-text");
    const nextButton = document.getElementById("next-button");

    function renderQuestion() {
      const question = questions[currentQuestion];
      questionCounter.textContent = `${currentQuestion + 1} / ${questions.length}`;
      progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      liveScore.textContent = score;
      category.textContent = question.category;
      questionText.textContent = question.q;
      answerList.innerHTML = "";
      feedbackPanel.classList.add("hidden");
      nextButton.classList.add("hidden");

      displayedOptions = question.options.map((_, index) => index);
      for (let index = displayedOptions.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [displayedOptions[index], displayedOptions[swapIndex]] = [displayedOptions[swapIndex], displayedOptions[index]];
      }
      displayedCorrectIndex = displayedOptions.indexOf(question.correct);
      displayedOptions.forEach((optionIndex, index) => {
        const option = question.options[optionIndex];
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-btn fade-in w-full rounded-2xl bg-white px-4 py-4 text-left font-semibold text-slate-700 sm:px-5";
        button.style.animationDelay = `${index * 55}ms`;
        button.setAttribute("aria-label", `Answer ${String.fromCharCode(65 + index)}: ${option}`);
        button.innerHTML = `<span class="flex items-center gap-3"><span class="option-letter grid place-items-center rounded-lg bg-[#edf0f9] text-sm text-[#283c8e]">${String.fromCharCode(65 + index)}</span><span>${option}</span></span>`;
        button.addEventListener("click", () => selectAnswer(index));
        answerList.appendChild(button);
      });
    }

    function selectAnswer(selectedIndex) {
      const question = questions[currentQuestion];
      const isCorrect = selectedIndex === displayedCorrectIndex;
      answers[currentQuestion] = displayedOptions[selectedIndex];
      if (isCorrect) score += 1;

      [...answerList.children].forEach((button, index) => {
        button.disabled = true;
        if (index === displayedCorrectIndex) button.classList.add("correct");
        if (index === selectedIndex && !isCorrect) button.classList.add("incorrect");
      });

      feedbackPanel.classList.remove("hidden");
      feedbackPanel.className = `mt-6 rounded-2xl border p-5 fade-in ${isCorrect ? "border-[#9bd2af] bg-[#edf9f1] text-[#145534]" : "border-[#efb5c0] bg-[#fff1f3] text-[#7f2637]"}`;
      feedbackTitle.textContent = isCorrect ? "Correct — well done." : "Not quite.";
      feedbackText.textContent = question.explanation;
      liveScore.textContent = score;
      nextButton.classList.remove("hidden");
    }

    function showResults() {
      quizView.classList.add("hidden");
      resultsView.classList.remove("hidden");
      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById("final-score").textContent = `${score} / ${questions.length}`;
      document.getElementById("score-message").textContent =
        percentage >= 85 ? "Excellent work — you have a strong understanding of storing graphics." :
        percentage >= 60 ? "Good progress — review the questions below to strengthen your knowledge." :
        "Keep revising the key ideas, then try again to improve your score.";

      const reviewList = document.getElementById("review-list");
      reviewList.innerHTML = "";
      questions.forEach((question, index) => {
        const correct = answers[index] === question.correct;
        const item = document.createElement("article");
        item.className = `rounded-2xl border p-4 ${correct ? "border-[#b8dfc4] bg-[#f2fbf5]" : "border-[#f0c1ca] bg-[#fff6f7]"}`;
        item.innerHTML = `
          <div class="flex items-start gap-3">
            <span class="mono mt-0.5 grid h-7 w-7 place-items-center rounded-md ${correct ? "bg-[#19794f] text-white" : "bg-[#b3263d] text-white"}">${correct ? "✓" : "×"}</span>
            <div>
              <p class="font-bold text-[#202a55]">Q${index + 1}. ${question.q}</p>
              <p class="mt-1 text-sm text-slate-600"><strong>Correct answer:</strong> ${question.options[question.correct]}</p>
            </div>
          </div>`;
        reviewList.appendChild(item);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    nextButton.addEventListener("click", () => {
      if (currentQuestion === questions.length - 1) {
        showResults();
      } else {
        currentQuestion += 1;
        renderQuestion();
      }
    });

    document.getElementById("restart-button").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      answers = [];
      resultsView.classList.add("hidden");
      quizView.classList.remove("hidden");
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    renderQuestion();
  </script>
