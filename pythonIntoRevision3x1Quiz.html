<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Quiz</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; margin: 0; }
    .code-font { font-family: 'JetBrains Mono', monospace; }
    .option-btn { transition: all 0.2s ease; }
    .option-btn:hover:not(.locked) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .option-btn.correct { animation: popCorrect 0.4s ease; }
    .option-btn.wrong { animation: shake 0.4s ease; }
    @keyframes popCorrect { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    .progress-fill { transition: width 0.5s ease; }
    @keyframes confetti { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(-80px) rotate(360deg);opacity:0} }
    .confetti-piece { position:absolute; width:8px; height:8px; border-radius:2px; animation: confetti 1s ease forwards; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto" style="background:#0d1117;">
   <!-- Start Screen -->
   <div id="start-screen" class="flex items-center justify-center min-h-full p-6">
    <div class="text-center fade-in max-w-lg w-full">
     <div class="text-6xl mb-6">
      🐍
     </div>
     <h1 id="main-title" class="text-4xl font-extrabold mb-3" style="color:#58a6ff;">Python Programming Quiz</h1>
     <p class="text-lg mb-8" style="color:#8b949e;">Test your knowledge of Python basics — variables, loops, data types, functions and more!</p>
     <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-sm font-semibold mb-8" style="background:#161b22;color:#7ee787;border:1px solid #30363d;">
      <i data-lucide="help-circle" style="width:16px;height:16px;"></i> 20 Questions
     </div><br><button onclick="startQuiz()" class="px-8 py-4 rounded-xl text-lg font-bold transition-all hover:scale-105" style="background:#238636;color:#fff;"> Start Quiz </button>
    </div>
   </div><!-- Quiz Screen -->
   <div id="quiz-screen" class="hidden min-h-full p-4 md:p-6">
    <div class="max-w-2xl mx-auto">
     <!-- Progress -->
     <div class="flex items-center justify-between mb-2">
      <span id="q-counter" class="text-sm font-bold" style="color:#58a6ff;">Question 1 / 15</span> <span id="score-display" class="text-sm font-semibold" style="color:#7ee787;">Score: 0</span>
     </div>
     <div class="w-full h-2 rounded-full mb-6" style="background:#21262d;">
      <div id="progress-bar" class="h-2 rounded-full progress-fill" style="background:linear-gradient(90deg,#238636,#7ee787);width:0%"></div>
     </div><!-- Question Card -->
     <div id="question-card" class="rounded-2xl p-6 md:p-8 fade-in" style="background:#161b22;border:1px solid #30363d;">
      <div id="category-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold mb-4" style="background:#1f2937;color:#58a6ff;"></div>
      <h2 id="question-text" class="text-xl md:text-2xl font-bold mb-2" style="color:#e6edf3;"></h2>
      <div id="code-block" class="hidden rounded-lg p-4 mt-3 mb-4 code-font text-sm overflow-x-auto" style="background:#0d1117;border:1px solid #30363d;color:#e6edf3;"></div>
      <div id="options-container" class="grid gap-3 mt-6"></div>
      <div id="explanation" class="hidden mt-5 p-4 rounded-lg text-sm" style="background:#0d1117;border:1px solid #30363d;">
       <p id="explanation-text" class="font-semibold" style="color:#8b949e;"></p>
      </div><button id="next-btn" class="hidden mt-5 w-full py-3 rounded-xl font-bold transition-all hover:scale-[1.02]" style="background:#238636;color:#fff;" onclick="nextQuestion()"> Next Question </button>
     </div>
    </div>
   </div><!-- Results Screen -->
   <div id="results-screen" class="hidden min-h-full flex items-center justify-center p-6">
    <div class="text-center max-w-lg w-full fade-in relative">
     <div id="confetti-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
     <div id="result-emoji" class="text-7xl mb-4"></div>
     <h2 id="result-title" class="text-3xl font-extrabold mb-2" style="color:#e6edf3;"></h2>
     <p id="result-subtitle" class="text-lg mb-6" style="color:#8b949e;"></p>
     <div class="inline-block rounded-2xl p-6 mb-6" style="background:#161b22;border:1px solid #30363d;">
      <div class="text-5xl font-extrabold mb-1" style="color:#58a6ff;" id="result-score"></div>
      <div class="text-sm" style="color:#8b949e;">
       out of 15 correct
      </div>
     </div>
     <div id="result-breakdown" class="grid grid-cols-3 gap-3 mb-8 text-center"></div>
     <p id="encouragement-msg" class="text-sm mb-6 font-semibold" style="color:#7ee787;"></p><button onclick="restartQuiz()" class="px-8 py-4 rounded-xl text-lg font-bold transition-all hover:scale-105" style="background:#238636;color:#fff;"> Try Again </button>
    </div>
   </div>
  </div>
  <script>
const questions = [
  { category:"Comments", q:"What symbol is used to write a comment in Python?", code:null, options:["#","//","/*","--"], answer:0, explanation:"The # symbol marks the start of a comment. Everything after # on that line is ignored by Python." },
  { category:"Variables", q:"What is a variable in Python?", code:null, options:["A named storage location for data","A type of loop","A built-in function","A mathematical formula"], answer:0, explanation:"A variable is a name that refers to a value stored in memory. It holds data that we can use and change." },
  { category:"Variable Names", q:"Which of these is a good variable name in Python?", code:null, options:["student_age","123name","my-score","class"], answer:0, explanation:"Good variable names are descriptive, start with a letter or underscore, and use lowercase with underscores. Avoid numbers at the start and Python keywords like 'class'." },
  { category:"Data Types", q:"What data type is the value <code class='code-font' style='color:#ff7b72'>42</code>?", code:null, options:["Integer","Float","String","Boolean"], answer:0, explanation:"42 is a whole number with no decimal point, so it's an Integer (int)." },
  { category:"Data Types", q:"Which of these creates a String variable?", code:null, options:["name = \"Python\"","age = 25","score = 9.5","count = True"], answer:0, explanation:"Strings are text enclosed in quotes. name = \"Python\" creates a string variable because \"Python\" is enclosed in quotes." },
  { category:"Data Types", q:"What data type is a single character like <code class='code-font' style='color:#ff7b72'>\"a\"</code>?", code:null, options:["Char","String","Integer","Boolean"], answer:0, explanation:"A single character is a Char data type. In Python, this is represented as a string containing one character, but the data type is Char." },
  { category:"Data Types", q:"Which of these is a String in Python?", code:null, options:["\"Hello World\"","42","3.14","True"], answer:0, explanation:"Strings are text enclosed in quotes. \"Hello World\" is a String. Numbers like 42 and 3.14 are not strings unless quoted." },
  { category:"Data Types", q:"What data type is the value <code class='code-font' style='color:#ff7b72'>True</code>?", code:null, options:["Boolean","String","Integer","Float"], answer:0, explanation:"True and False are Boolean values used for logical operations." },
  { category:"Initialisation", q:"How do you create an integer variable called <code class='code-font' style='color:#ff7b72'>age</code> with value 15?", code:null, options:["age = 15","int age = 15","age: 15 =","15 = age"], answer:0, explanation:"In Python, you use the = operator to assign a value to a variable. age = 15 creates an integer variable." },
  { category:"Initialisation", q:"How do you create a string variable called <code class='code-font' style='color:#ff7b72'>name</code> with value \"Alice\"?", code:null, options:["name = \"Alice\"","\"Alice\" = name","name: \"Alice\"","string name = \"Alice\""], answer:0, explanation:"Use the = operator to assign a string value. name = \"Alice\" creates a string variable." },
  { category:"Output", q:"What does the <code class='code-font' style='color:#ff7b72'>print()</code> function do?", code:null, options:["Displays text or variables on the screen","Sends data to a printer","Creates a new line","Saves data to a file"], answer:0, explanation:"print() outputs information to the screen (console). It's how we display messages and results." },
  { category:"Output", q:"What will this code display?", code:'print(5 + 3)', options:["8","5 + 3","Error","53"], answer:0, explanation:"print() evaluates 5 + 3 to get 8, then displays 8 on the screen." },
  { category:"Input", q:"Which function gets text input from a user?", code:null, options:["input()","get()","read()","scan()"], answer:0, explanation:"input() displays a prompt and waits for the user to type something and press Enter." },
  { category:"Input & Variables", q:"How do you store user input in a variable called <code class='code-font' style='color:#ff7b72'>name</code>?", code:null, options:["name = input()","input() = name","name == input()","input(name)"], answer:0, explanation:"Use name = input() to get text from the user and store it in the variable 'name'." },
  { category:"Print with Variables", q:"What will this code display?", code:'name = \"Bob\"\nage = 10\nprint(\"Name:\", name, \"Age:\", age)', options:["Name: Bob Age: 10","Name: Age:","\"Name:\" \"Age:\"","Error"], answer:0, explanation:"The comma in print() separates items, and they are displayed with spaces between them." },
  { category:"Calculations", q:"How do you calculate the area of a rectangle with width and height variables?", code:null, options:["area = width * height","area = width + height","area = width / height","area = width - height"], answer:0, explanation:"Area of a rectangle = width × height. Using variables, the formula is area = width * height." },
  { category:"Calculations", q:"What will this code output?", code:'print(10 - 4)', options:["6","14","-6","Error"], answer:0, explanation:"10 - 4 equals 6. The - operator subtracts the second number from the first." },
  { category:"Calculations", q:"What will this code output?", code:'print(20 / 4)', options:["5.0","5","4","Error"], answer:0, explanation:"20 / 4 equals 5.0 (a float). The / operator always returns a float in Python 3." },
  { category:"IPO Model", q:"In the Input-Process-Output model, which stage involves getting data from the user?", code:null, options:["Input","Process","Output","None"], answer:0, explanation:"Input is where we collect data from the user using functions like input(). Process is where we calculate. Output is where we display results using print()." },
  { category:"IPO Model", q:"What does the Process stage do in the Input-Process-Output model?", code:null, options:["Performs calculations and changes data","Gets data from the user","Displays results on screen","Saves data to a file"], answer:0, explanation:"The Process stage is where the program performs calculations, comparisons, and manipulates data to produce results." }
];

// Shuffle options but track answer
let quizData = [];
let currentQ = 0, score = 0, locked = false;

const defaultConfig = {
  quiz_title: "Python Programming Quiz",
  encouragement_text: "Keep practising and you'll master Python in no time!",
  background_color: "#0d1117",
  surface_color: "#161b22",
  text_color: "#e6edf3",
  primary_action_color: "#238636",
  accent_color: "#58a6ff"
};

function applyConfig(config) {
  const bg = config.background_color || defaultConfig.background_color;
  const surface = config.surface_color || defaultConfig.surface_color;
  const text = config.text_color || defaultConfig.text_color;
  const primary = config.primary_action_color || defaultConfig.primary_action_color;
  const accent = config.accent_color || defaultConfig.accent_color;
  const title = config.quiz_title || defaultConfig.quiz_title;

  document.getElementById('app').style.background = bg;
  document.getElementById('main-title').textContent = title;
  document.getElementById('main-title').style.color = accent;

  // Surface cards
  document.querySelectorAll('[data-surface]').forEach(el => {
    el.style.background = surface;
    el.style.borderColor = surface;
  });
  const qc = document.getElementById('question-card');
  if(qc) { qc.style.background = surface; }
  const resBox = document.querySelector('#results-screen [style*="161b22"]');

  // Text
  document.querySelectorAll('[data-text]').forEach(el => el.style.color = text);
  const qt = document.getElementById('question-text');
  if(qt) qt.style.color = text;

  // Primary buttons
  document.querySelectorAll('[data-primary]').forEach(el => el.style.background = primary);
  const startBtn = document.querySelector('#start-screen button');
  if(startBtn) startBtn.style.background = primary;
  const nextBtn = document.getElementById('next-btn');
  if(nextBtn) nextBtn.style.background = primary;
  const retryBtn = document.querySelector('#results-screen button');
  if(retryBtn) retryBtn.style.background = primary;

  // Accent
  document.getElementById('q-counter').style.color = accent;
  document.getElementById('result-score') && (document.getElementById('result-score').style.color = accent);
}

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => applyConfig(config),
  mapToCapabilities: (config) => ({
    recolorables: [
      { get:()=>config.background_color||defaultConfig.background_color, set:(v)=>{config.background_color=v;window.elementSdk.setConfig({background_color:v})} },
      { get:()=>config.surface_color||defaultConfig.surface_color, set:(v)=>{config.surface_color=v;window.elementSdk.setConfig({surface_color:v})} },
      { get:()=>config.text_color||defaultConfig.text_color, set:(v)=>{config.text_color=v;window.elementSdk.setConfig({text_color:v})} },
      { get:()=>config.primary_action_color||defaultConfig.primary_action_color, set:(v)=>{config.primary_action_color=v;window.elementSdk.setConfig({primary_action_color:v})} },
      { get:()=>config.accent_color||defaultConfig.accent_color, set:(v)=>{config.accent_color=v;window.elementSdk.setConfig({accent_color:v})} }
    ],
    borderables: [],
    fontEditable: {
      get:()=>config.font_family||defaultConfig.font_family||'Nunito',
      set:(v)=>{config.font_family=v;window.elementSdk.setConfig({font_family:v})}
    },
    fontSizeable: {
      get:()=>config.font_size||defaultConfig.font_size||16,
      set:(v)=>{config.font_size=v;window.elementSdk.setConfig({font_size:v})}
    }
  }),
  mapToEditPanelValues: (config) => new Map([
    ["quiz_title", config.quiz_title || defaultConfig.quiz_title],
    ["encouragement_text", config.encouragement_text || defaultConfig.encouragement_text]
  ])
});

function shuffleArray(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function prepareQuiz() {
  quizData = shuffleArray(questions).map(q => {
    const indexed = q.options.map((o,i) => ({text:o, isCorrect:i===q.answer}));
    const shuffled = shuffleArray(indexed);
    return {...q, shuffledOptions:shuffled};
  });
}

function startQuiz() {
  prepareQuiz();
  currentQ = 0; score = 0; locked = false;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('results-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const data = quizData[currentQ];
  const config = window.elementSdk.config || defaultConfig;
  document.getElementById('q-counter').textContent = `Question ${currentQ+1} / 20`;
  document.getElementById('score-display').textContent = `Score: ${score}`;
  document.getElementById('progress-bar').style.width = `${((currentQ)/20)*100}%`;
  document.getElementById('category-badge').textContent = data.category;
  document.getElementById('question-text').innerHTML = data.q;
  document.getElementById('explanation').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  locked = false;

  const codeBlock = document.getElementById('code-block');
  if(data.code) { codeBlock.classList.remove('hidden'); codeBlock.textContent = data.code; }
  else { codeBlock.classList.add('hidden'); }

  const container = document.getElementById('options-container');
  container.innerHTML = '';
  data.shuffledOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn text-left p-4 rounded-xl font-semibold transition-all';
    btn.style.cssText = `background:#0d1117;border:2px solid #30363d;color:#e6edf3;`;
    btn.innerHTML = `<span class="inline-block w-7 h-7 rounded-full text-center text-sm leading-7 mr-3 font-bold" style="background:#21262d;color:#58a6ff;">${String.fromCharCode(65+i)}</span>${opt.text}`;
    btn.onclick = () => selectAnswer(btn, opt.isCorrect);
    container.appendChild(btn);
  });

  // Re-animate card
  const card = document.getElementById('question-card');
  card.classList.remove('fade-in');
  void card.offsetWidth;
  card.classList.add('fade-in');
}

function selectAnswer(btn, isCorrect) {
  if(locked) return;
  locked = true;
  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.classList.add('locked'));

  if(isCorrect) {
    score++;
    btn.style.borderColor = '#238636';
    btn.style.background = 'rgba(35,134,54,0.15)';
    btn.classList.add('correct');
  } else {
    btn.style.borderColor = '#f85149';
    btn.style.background = 'rgba(248,81,73,0.15)';
    btn.classList.add('wrong');
    // Highlight correct
    allBtns.forEach((b,i) => {
      if(quizData[currentQ].shuffledOptions[i].isCorrect) {
        b.style.borderColor = '#238636';
        b.style.background = 'rgba(35,134,54,0.15)';
      }
    });
  }

  document.getElementById('score-display').textContent = `Score: ${score}`;
  document.getElementById('explanation-text').textContent = quizData[currentQ].explanation;
  document.getElementById('explanation').classList.remove('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
  document.getElementById('next-btn').textContent = currentQ === 14 ? 'See Results' : 'Next Question';
}

function nextQuestion() {
  currentQ++;
  if(currentQ >= 20) { showResults(); return; }
  renderQuestion();
}

function showResults() {
  document.getElementById('quiz-screen').classList.add('hidden');
  const rs = document.getElementById('results-screen');
  rs.classList.remove('hidden');

  const config = window.elementSdk.config || defaultConfig;
  const pct = Math.round((score/20)*100);
  let emoji, title, subtitle, grade;
  
  if(pct >= 80) { emoji='🏆'; title='Outstanding! Grade: A*'; subtitle='Excellent understanding of Python basics!'; grade='A*'; }
  else if(pct >= 70) { emoji='⭐'; title='Great Job! Grade: A'; subtitle="You've got a solid understanding!"; grade='A'; }
  else if(pct >= 60) { emoji='👍'; title='Good Effort! Grade: B'; subtitle='You have a good grasp of the concepts!'; grade='B'; }
  else if(pct >= 50) { emoji='💪'; title='Good Progress! Grade: C'; subtitle='Keep practising to strengthen your skills!'; grade='C'; }
  else if(pct >= 45) { emoji='📚'; title='Keep Going! Grade: D'; subtitle='Review the topics and try again soon!'; grade='D'; }
  else { emoji='🔄'; title='Keep Revising'; subtitle='Take time to review Python basics and try again!'; grade='U'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-subtitle').textContent = subtitle;
  document.getElementById('result-score').textContent = score;
  document.getElementById('encouragement-msg').textContent = config.encouragement_text || defaultConfig.encouragement_text;
  document.getElementById('progress-bar').style.width = '100%';

  // Breakdown
  const bd = document.getElementById('result-breakdown');
  bd.innerHTML = [
    {label:'Correct', val:score, color:'#7ee787'},
    {label:'Wrong', val:20-score, color:'#f85149'},
    {label:'Accuracy', val:pct+'%', color:'#58a6ff'}
  ].map(d => `<div class="rounded-xl p-3" style="background:#161b22;border:1px solid #30363d;"><div class="text-2xl font-extrabold" style="color:${d.color}">${d.val}</div><div class="text-xs" style="color:#8b949e">${d.label}</div></div>`).join('');

  if(pct >= 70) spawnConfetti();
}

function spawnConfetti() {
  const container = document.getElementById('confetti-container');
  container.innerHTML = '';
  const colors = ['#58a6ff','#7ee787','#ff7b72','#d2a8ff','#ffa657'];
  for(let i=0;i<30;i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100+'%';
    piece.style.top = Math.random()*100+'%';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay = Math.random()*0.5+'s';
    container.appendChild(piece);
  }
}

function restartQuiz() {
  document.getElementById('results-screen').classList.add('hidden');
  startQuiz();
}

lucide.createIcons();
</script>
