  <script src="/_sdk/5629ea66dc55d54f.editing_sdk.js" integrity="sha512-snPYzGvgiTEMUBOb+HlCBkFeiM0IRX4hcgA78wvalhC0WnJtaX+RCbosPWtNqZsZ7sZ9NwN0oePZYa+IlMwa+w=="></script>
  <script>
    const questions = [
      {
        question: "What is the smallest unit of storage?",
        options: ["Byte", "Bit", "Kilobyte", "Megabyte"],
        correct: 1,
        explanation: "A bit is the smallest unit of storage. It holds a single binary digit: 0 or 1."
      },
      {
        question: "How many bits make one byte?",
        options: ["2 bits", "4 bits", "8 bits", "16 bits"],
        correct: 2,
        explanation: "One byte is made up of 8 bits."
      },
      {
        question: "Which list is in order from smallest to largest?",
        options: [
          "Bit, Byte, Kilobyte, Megabyte",
          "Byte, Bit, Kilobyte, Megabyte",
          "Bit, Kilobyte, Byte, Megabyte",
          "Megabyte, Kilobyte, Byte, Bit"
        ],
        correct: 0,
        explanation: "The correct ascending order is bit, byte, kilobyte, megabyte, then gigabyte, terabyte and petabyte."
      },
      {
        question: "What is a sensible example of something stored in bytes?",
        options: ["A single character of text", "A full hard disk drive", "A year's particle collider data", "A laptop's RAM"],
        correct: 0,
        explanation: "A single character of text can take one byte to store."
      },
      {
        question: "A page of text would usually be measured in which unit?",
        options: ["Bits", "Kilobytes", "Terabytes", "Petabytes"],
        correct: 1,
        explanation: "A page of text would typically take a few kilobytes."
      },
      {
        question: "An average MP3 file is often around 5–7 of which unit?",
        options: ["Bytes", "Kilobytes", "Megabytes", "Terabytes"],
        correct: 2,
        explanation: "The lesson states that an average MP3 file can be between 5 and 7 MB."
      },
      {
        question: "8192 bytes is equivalent to:",
        options: ["8 bits", "8 kilobytes", "8 megabytes", "1024 kilobytes"],
        correct: 1,
        explanation: "To move from bytes to kilobytes, divide by 1024: 8192 ÷ 1024 = 8 kilobytes."
      },
      {
        question: "When converting a large number of bits into bytes, what operation should you use?",
        options: ["Multiply by 8", "Divide by 8", "Multiply by 1024", "Add 1024"],
        correct: 1,
        explanation: "There are 8 bits in a byte, so divide the number of bits by 8 to convert to bytes."
      },
      {
        question: "0.5 kilobytes is equivalent to:",
        options: ["512 bytes", "512 bits", "1024 bytes", "2 bytes"],
        correct: 0,
        explanation: "Because the value is smaller than 1, multiply by 1024: 0.5 KB × 1024 = 512 bytes."
      },
      {
        question: "0.0625 terabytes is equivalent to:",
        options: ["16 gigabytes", "32 gigabytes", "64 gigabytes", "128 gigabytes"],
        correct: 2,
        explanation: "To convert the value to the smaller unit, multiply by 1024: 0.0625 TB × 1024 = 64 GB."
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const mount = document.getElementById("question-mount");
    const quizScreen = document.getElementById("quiz-screen");
    const resultsScreen = document.getElementById("results-screen");
    const questionCounter = document.getElementById("question-counter");
    const scoreCounter = document.getElementById("score-counter");
    const progressBar = document.getElementById("progress-bar");

    function updateProgress() {
      questionCounter.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      scoreCounter.textContent = `Score: ${score}`;
      progressBar.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
    }

    function renderQuestion() {
      const item = questions[currentQuestion];
      const fragment = document.getElementById("question-template").content.cloneNode(true);
      const card = fragment.querySelector("article");
      const questionText = card.querySelector('[data-template-id="question-text"]');
      const buttons = [...card.querySelectorAll('[data-template-id="answer-option"]')];
      const feedback = card.querySelector("#feedback-panel");
      const feedbackIcon = card.querySelector("#feedback-icon");
      const correctTitle = card.querySelector('[data-template-id="correct-feedback-title"]');
      const incorrectTitle = card.querySelector('[data-template-id="incorrect-feedback-title"]');
      const feedbackExplanation = card.querySelector("#feedback-explanation");
      const nextWrap = card.querySelector("#next-wrap");
      const nextButton = card.querySelector("#next-button");

      questionText.textContent = item.question;
      buttons.forEach((button, index) => {
        button.querySelector(".answer-text").textContent = item.options[index];
        button.addEventListener("click", () => answerQuestion(index));
      });

      function answerQuestion(selectedIndex) {
        buttons.forEach(button => button.disabled = true);
        const isCorrect = selectedIndex === item.correct;

        if (isCorrect) {
          score++;
          buttons[selectedIndex].classList.add("is-correct");
          feedback.className = "feedback-enter mt-6 rounded-2xl bg-[#e3f6ec] p-5 text-[#115b40]";
          feedbackIcon.setAttribute("data-lucide", "circle-check");
          correctTitle.classList.remove("hidden");
          feedbackExplanation.textContent = "Correct — " + item.explanation;
        } else {
          buttons[selectedIndex].classList.add("is-incorrect");
          buttons[item.correct].classList.add("is-reveal");
          feedback.className = "feedback-enter mt-6 rounded-2xl bg-[#fde9ed] p-5 text-[#8e2840]";
          feedbackIcon.setAttribute("data-lucide", "circle-x");
          incorrectTitle.classList.remove("hidden");
          feedbackExplanation.textContent = "The correct answer is “" + item.options[item.correct] + "”. " + item.explanation;
        }

        feedback.classList.remove("hidden");
        nextWrap.classList.remove("hidden");
        nextWrap.classList.add("flex");
        scoreCounter.textContent = `Score: ${score}`;
        lucide.createIcons();
      }

      nextButton.addEventListener("click", () => {
        if (currentQuestion === questions.length - 1) {
          showResults();
        } else {
          currentQuestion++;
          updateProgress();
          mount.replaceChildren();
          mount.appendChild(renderQuestion());
          lucide.createIcons();
        }
      });

      return fragment;
    }

    function showResults() {
      quizScreen.classList.add("hidden");
      resultsScreen.classList.remove("hidden");
      questionCounter.textContent = "Quiz complete";
      progressBar.style.width = "100%";

      const percentage = Math.round((score / questions.length) * 100);
      document.getElementById("final-score").textContent = `${score}/10`;
      document.getElementById("score-ring").style.setProperty("--score-angle", `${percentage * 3.6}deg`);

      const message = document.getElementById("results-message");
      if (score === 10) {
        message.textContent = "Outstanding work! You have confidently mastered the storage units and conversions in this quiz.";
      } else if (score >= 7) {
        message.textContent = "Well done! You have a strong understanding of storage units. Review any missed conversions and try again.";
      } else if (score >= 4) {
        message.textContent = "Good effort. Review the storage order and the divide-or-multiply conversion rules, then have another go.";
      } else {
        message.textContent = "Keep practising. Revisit the storage ladder: 8 bits make a byte, and each larger unit is 1024 of the previous one.";
      }
      lucide.createIcons();
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      resultsScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      updateProgress();
      mount.replaceChildren();
      mount.appendChild(renderQuestion());
      lucide.createIcons();
    }

    document.getElementById("restart-button").addEventListener("click", restartQuiz);

    updateProgress();
    mount.appendChild(renderQuestion());
    lucide.createIcons();
  </script>
